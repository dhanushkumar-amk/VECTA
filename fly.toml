# fly.toml app configuration file for Vecta REST API Server
app = "vecta-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  VECTA_PORT = "6333"
  VECTA_DATA_DIR = "/data"

[mounts]
  source = "vecta_data"
  destination = "/data"

[http_service]
  internal_port = 6333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
