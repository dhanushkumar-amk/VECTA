[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vecta"
version = "0.1.0"
description = "A production-grade vector database built from scratch in Rust, benchmarked against FAISS"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
