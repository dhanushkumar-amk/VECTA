[package]
name = "vecta"
version = "0.1.0"
edition = "2021"
description = "A production-grade vector database built from scratch in Rust, benchmarked against FAISS"

[lib]
name = "vecta"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
