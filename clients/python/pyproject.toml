[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vecta-client"
version = "0.1.0"
description = "Pure-Python HTTP client SDK for the Vecta vector database REST API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
test = [
    "pytest>=7.0",
]
