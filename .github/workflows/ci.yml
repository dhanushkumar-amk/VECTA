name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: Lint (fmt + clippy)
  # ─────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────────────
  # Job 2: Test Core (pure Rust, no Python)
  # ─────────────────────────────────────────────────────
  test-core:
    name: Test Core
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run core tests (release mode)
        run: cargo test --release -- --nocapture

  # ─────────────────────────────────────────────────────
  # Job 3: Test Python Bindings
  # ─────────────────────────────────────────────────────
  test-python-bindings:
    name: Python Bindings (py3.11)
    needs: test-core
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy matplotlib requests
          pip install faiss-cpu || echo "faiss-cpu unavailable, skipping"

      - name: Build and install wheel
        run: pip install .

      - name: Run Python tests
        run: pytest tests/python/ -v
